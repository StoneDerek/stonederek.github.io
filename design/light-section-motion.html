<div class="viz-carousel" id="light-section-motion" aria-label="Lightweight portfolio transitions">
  <section data-variant="Resistance pull" aria-label="Pull the About handle right past a resistance point, then release; a short pull springs back">
    <div class="light-site" data-motion="pull"></div>
  </section>
  <section data-variant="Soft replace" aria-label="Content crossfades in 140 milliseconds without moving" hidden>
    <div class="light-site" data-motion="fade"></div>
  </section>
  <section data-variant="Short drift" aria-label="Text moves twelve pixels in the section direction while content fades" hidden>
    <div class="light-site" data-motion="drift"></div>
  </section>
  <section data-variant="Heading cue" aria-label="Only the new heading and active navigation marker animate" hidden>
    <div class="light-site" data-motion="heading"></div>
  </section>
  <section data-variant="Accent only" aria-label="Content changes immediately while the menu color and current section marker update" hidden>
    <div class="light-site" data-motion="accent"></div>
  </section>
</div>

<style>
  #light-section-motion .light-site {
    --paper: #fff;
    --ink: #241a36;
    --accent: #ded3ff;
    --line: #ded8e8;
    position: relative;
    isolation: isolate;
    height: 590px;
    overflow: hidden;
    color: var(--ink);
    background: var(--paper);
    font: 14px/1.55 Arial, Helvetica, sans-serif;
    text-align: left;
  }
  #light-section-motion .light-site * { box-sizing: border-box; }
  #light-section-motion .light-site button,
  #light-section-motion .light-site a { font: inherit; color: inherit; }
  #light-section-motion .light-site button { border: 0; }
  #light-section-motion .light-site a { text-decoration: none; }
  #light-section-motion .light-site [hidden] { display: none !important; }
  #light-section-motion .light-site button:focus-visible,
  #light-section-motion .light-site a:focus-visible,
  #light-section-motion .light-site summary:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  #light-section-motion .light-header {
    position: absolute;
    z-index: 10;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(320px, calc(100% - 24px));
    color: var(--ink);
  }
  #light-section-motion .light-menu { background: var(--accent); border-radius: 8px; overflow: hidden; }
  #light-section-motion .light-summary {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 2px 12px;
    min-height: 66px;
    padding: 12px 17px;
    list-style: none;
    font-size: 13px;
    line-height: 18px;
  }
  #light-section-motion .light-summary::-webkit-details-marker { display: none; }
  #light-section-motion .light-domain { grid-column: 1; font-weight: 500; }
  #light-section-motion .light-location { grid-column: 1; font-weight: 400; }
  #light-section-motion .light-menu-affordance { grid-column: 2; grid-row: 1 / 3; display: flex; align-items: center; gap: 6px; }
  #light-section-motion .light-menu[open] .light-menu-affordance .light-closed-icon,
  #light-section-motion .light-menu:not([open]) .light-menu-affordance .light-open-icon { display: none; }
  #light-section-motion .light-menu-body { padding: 2px 17px 18px; }
  #light-section-motion .light-menu-nav button,
  #light-section-motion .light-project-index button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-height: 36px;
    padding: 5px 0;
    background: transparent;
    text-align: left;
  }
  #light-section-motion .light-menu-nav button { font-size: 18px; }
  #light-section-motion .light-project-index { padding: 8px 0 12px; margin-top: 8px; border-top: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
  #light-section-motion .light-project-index > span { display: block; font-size: 12px; margin-bottom: 3px; }
  #light-section-motion .light-menu-contact { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
  #light-section-motion .light-menu-contact a { min-height: 28px; display: inline-flex; align-items: center; }
  #light-section-motion .light-switcher {
    position: relative;
    display: flex;
    align-items: stretch;
    justify-content: center;
    margin-top: 6px;
    padding: 3px;
    border-radius: 6px;
    background: var(--paper);
  }
  #light-section-motion .light-switcher button {
    flex: 1;
    min-height: 40px;
    padding: 5px 10px 9px;
    background: transparent;
    border-radius: 4px;
  }
  #light-section-motion .light-switcher button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 30%, var(--paper)); }
  #light-section-motion .light-switcher button:hover { background: color-mix(in srgb, var(--accent) 65%, var(--paper)); }
  #light-section-motion .light-current-marker {
    position: absolute;
    left: 3px;
    bottom: 3px;
    height: 2px;
    width: calc((100% - 6px) / 3);
    border-radius: 2px;
    background: var(--ink);
    pointer-events: none;
  }
  #light-section-motion .light-menu[open] + .light-switcher { visibility: hidden; }
  #light-section-motion .light-viewport { position: absolute; inset: 0; overflow: hidden; }
  #light-section-motion .light-page { position: absolute; inset: 0; background: var(--paper); padding: 162px 48px 28px; }
  #light-section-motion .light-home .light-content { display: grid; grid-template-columns: 1fr 1.05fr; gap: 42px; }
  #light-section-motion .light-eyebrow { margin: 0 0 18px; font-size: 12px; }
  #light-section-motion .light-name { margin: 0 0 18px; font-size: 68px; font-weight: 400; line-height: 1; letter-spacing: -.06em; }
  #light-section-motion .light-period { color: #a78bdd; }
  #light-section-motion .light-lead { margin: 0; max-width: 18ch; font-size: 22px; line-height: 1.35; }
  #light-section-motion .light-copy { padding-top: 33px; }
  #light-section-motion .light-copy p { margin: 0 0 19px; font-size: 16px; line-height: 1.65; }
  #light-section-motion .light-actions { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 27px; align-items: center; }
  #light-section-motion .light-actions button { min-height: 40px; padding: 9px 14px; background: var(--accent); border-radius: 6px; }
  #light-section-motion .light-actions .light-text-link { padding-inline: 0; background: transparent; text-decoration: underline; text-underline-offset: 4px; }
  #light-section-motion .light-about h1 { margin: 0 0 28px; font-size: 64px; line-height: 1; letter-spacing: -.06em; font-weight: 400; }
  #light-section-motion .light-about .light-period { color: #75b6ec; }
  #light-section-motion .light-about-body { display: grid; grid-template-columns: .8fr 1.2fr; gap: 34px; padding-top: 23px; border-top: 1px solid var(--line); }
  #light-section-motion .light-about-body h2 { margin: 0; font-size: 20px; font-weight: 400; }
  #light-section-motion .light-about-body p { margin: 0; font-size: 16px; line-height: 1.65; }
  #light-section-motion .light-projects { padding: 0; }
  #light-section-motion .light-cover { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 63% 50%; }
  #light-section-motion .light-project-title { position: absolute; inset: 48% 24px auto; text-align: center; margin: 0; color: var(--accent); font-size: 16px; font-weight: 500; }
  #light-section-motion .light-project-meta { position: absolute; inset: auto 24px 66px; display: flex; justify-content: space-between; gap: 12px; color: var(--accent); font-size: 12px; }
  #light-section-motion .light-project-strip { position: absolute; inset: auto 24px 20px; display: flex; justify-content: center; gap: 6px; }
  #light-section-motion .light-project-strip button { display: grid; place-items: center; min-width: 40px; min-height: 36px; background: #1b204a; color: #fff; border-radius: 3px; font-size: 12px; }
  #light-section-motion .light-project-strip button[aria-current="true"] { background: var(--accent); color: var(--ink); }
  #light-section-motion .light-cover { touch-action: pan-y; user-select: none; -webkit-user-drag: none; }
  #light-section-motion .light-pull-wrap { position: absolute; left: 20px; top: 64%; width: 176px; height: 50px; }
  #light-section-motion .light-pull-rail { position: absolute; top: 24px; left: 30px; width: 112px; height: 2px; background: #c0c4e1; }
  #light-section-motion .light-pull-detent { position: absolute; top: 21px; left: 130px; width: 8px; height: 8px; background: #ded3ff; border-radius: 50%; }
  #light-section-motion .light-pull {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    gap: 0;
    align-items: center;
    justify-content: center;
    width: 98px;
    height: 48px;
    padding: 8px 10px;
    color: #241a36 !important;
    background: #ded3ff;
    border-radius: 7px;
    touch-action: none;
    user-select: none;
  }
  #light-section-motion .light-pull[data-armed="true"] { background: #cde9ff; }
  #light-section-motion .light-site[data-motion="pull"] .light-pull { cursor: grab; }
  #light-section-motion .light-site[data-pulling="true"] .light-pull { cursor: grabbing; }
  #light-section-motion .light-pull-label { min-width: 43px; }
  #light-section-motion .light-pull-hint { font-size: 11px; line-height: 14px; }
  #light-section-motion .light-article { padding-top: 155px; }
  #light-section-motion .light-article h1 { font-size: 48px; letter-spacing: -.045em; font-weight: 400; line-height: 1.05; margin: 22px 0; }
  #light-section-motion .light-article p { font-size: 16px; max-width: 52ch; margin: 0; line-height: 1.65; }
  #light-section-motion .light-back { padding: 4px 0; background: transparent; min-height: 40px; display: flex; align-items: center; gap: 7px; }
  #light-section-motion .light-status { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
  @media (max-width: 600px) {
    #light-section-motion .light-site { height: 740px; }
    #light-section-motion .light-page { padding: 155px 25px 26px; }
    #light-section-motion .light-home .light-content { display: block; }
    #light-section-motion .light-name { font-size: 58px; line-height: 1.04; margin-bottom: 17px; }
    #light-section-motion .light-name br { display: none; }
    #light-section-motion .light-lead { font-size: 21px; max-width: 20ch; }
    #light-section-motion .light-copy { padding-top: 25px; }
    #light-section-motion .light-copy p { font-size: 16px; margin-bottom: 16px; }
    #light-section-motion .light-actions { margin-top: 22px; gap: 10px 18px; }
    #light-section-motion .light-about h1 { font-size: 52px; margin-bottom: 25px; }
    #light-section-motion .light-about-body { display: block; }
    #light-section-motion .light-about-body h2 { margin-bottom: 15px; }
    #light-section-motion .light-projects { padding: 0; }
    #light-section-motion .light-project-strip button { min-width: 34px; }
    #light-section-motion .light-project-meta { inset-inline: 20px; }
    #light-section-motion .light-article h1 { font-size: 42px; }
  }
  @media (max-width: 360px) {
    #light-section-motion .light-site { height: 820px; }
    #light-section-motion .light-page { padding-inline: 20px; }
    #light-section-motion .light-name { font-size: 52px; }
    #light-section-motion .light-projects { padding: 0; }
  }
  @media (pointer: coarse) {
    #light-section-motion .light-switcher button,
    #light-section-motion .light-project-strip button,
    #light-section-motion .light-menu-nav button,
    #light-section-motion .light-project-index button,
    #light-section-motion .light-menu-contact a { min-height: 44px; }
    #light-section-motion .light-project-strip button { min-width: 36px; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('light-section-motion');
  if (!root) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const order = ['home', 'about', 'projects'];
  const labels = {home: 'Home', about: 'About', projects: 'Projects'};
  const palette = {home: ['#ded3ff', '#241a36'], about: ['#cde9ff', '#1b2b43'], projects: ['#dcff67', '#17220b']};
  const projectData = JSON.parse(document.getElementById('light-motion-project-data').textContent);
  const projectTitles = projectData.map(project => project.title);
  const firstCover = document.getElementById('light-motion-projects').content.querySelector('.light-cover').getAttribute('src');
  const projectImages = projectData.map(project => project.image || firstCover);
  const projectDescriptions = projectData.map(project => project.imageAlt);
  const templates = Object.fromEntries([...order, 'article'].map(name => [name, document.getElementById('light-motion-' + name)]));

  for (const site of root.querySelectorAll('.light-site')) {
    site.append(document.getElementById('light-motion-chrome').content.cloneNode(true));
    const viewport = site.querySelector('.light-viewport');
    const header = site.querySelector('.light-header');
    const menu = site.querySelector('.light-menu');
    const toggle = menu.querySelector('summary');
    const marker = site.querySelector('.light-current-marker');
    const status = site.querySelector('.light-status');
    let current = site.dataset.motion === 'pull' ? 'projects' : 'home';
    let view = current;
    let currentProject = 'Signal studies';
    let pending = null;
    let running = false;
    let animations = [];
    let drag = null;
    let galleryDrag = null;
    let suppressClickUntil = 0;
    let pullAnimation = null;
    function makePage(name) {
      const page = templates[name].content.firstElementChild.cloneNode(true);
      if (name === 'projects' && site.dataset.motion === 'pull') page.append(document.getElementById('light-motion-pull').content.cloneNode(true));
      return page;
    }
    viewport.append(makePage(view));
    site.dataset.page = current;
    site.dataset.view = view;
    site.dataset.busy = 'false';
    site.dataset.pulling = 'false';
    if (current === 'projects') {
      site.style.setProperty('--accent', palette.projects[0]);
      site.style.setProperty('--ink', palette.projects[1]);
      header.querySelector('[data-section-label]').textContent = 'Projects';
      header.querySelector('[data-location-label]').textContent = 'Gallery';
      marker.style.transform = 'translateX(200%)';
      for (const button of header.querySelectorAll('[data-route]')) {
        if (button.dataset.route === 'projects') button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      }
    }

    function finishAnimations() {
      for (const animation of site.getAnimations({subtree: true})) {
        try { animation.finish(); } catch { animation.cancel(); }
      }
    }

    async function transition(next) {
      const from = current;
      const route = next.route;
      const nextView = next.project ? 'article' : route;
      if (route === current && nextView === view && !next.project) return;
      const outgoing = viewport.firstElementChild;
      const incoming = makePage(nextView);
      const index = order.indexOf(route);
      const direction = index >= order.indexOf(from) ? 1 : -1;
      const [accent, ink] = palette[route];
      const beforeMarker = marker.style.transform || 'translateX(0%)';
      const nextMarker = `translateX(${index * 100}%)`;
      const oldAccent = getComputedStyle(menu).backgroundColor;
      if (next.project) {
        currentProject = projectData.find(project => project.slug === next.project)?.title || 'Signal studies';
        incoming.querySelector('[data-article-title]').textContent = currentProject;
      }
      if (outgoing.contains(document.activeElement) || menu.contains(document.activeElement)) toggle.focus({preventScroll: true});
      outgoing.inert = true;
      outgoing.setAttribute('aria-hidden', 'true');
      incoming.inert = true;
      incoming.setAttribute('aria-hidden', 'true');
      incoming.style.zIndex = '2';
      viewport.append(incoming);
      site.dataset.busy = 'true';
      site.dataset.direction = String(direction);
      site.style.setProperty('--accent', accent);
      site.style.setProperty('--ink', ink);
      header.querySelector('[data-section-label]').textContent = labels[route];
      header.querySelector('[data-location-label]').textContent = route === 'home' ? 'Introduction' : route === 'about' ? 'Derek Stone' : next.project ? currentProject : 'Gallery';
      for (const button of header.querySelectorAll('[data-route]')) {
        if (button.dataset.route === route) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      }
      marker.style.transform = nextMarker;
      menu.open = false;
      try {
        if (!reduced.matches && !document.hidden && typeof incoming.animate === 'function') {
          const mode = site.dataset.motion;
          const duration = mode === 'fade' ? 140 : mode === 'drift' ? 180 : 160;
          const settings = {duration, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both'};
          animations = [menu.animate([{backgroundColor: oldAccent}, {backgroundColor: accent}], settings)];
          if (mode === 'fade' || mode === 'drift' || mode === 'pull') {
            animations.push(incoming.animate([{opacity: 0}, {opacity: 1}], settings));
            if (mode === 'drift') {
              const copy = incoming.querySelector('[data-drift-content]');
              animations.push(copy.animate([{transform: `translateX(${direction * 12}px)`}, {transform: 'translateX(0)'}], settings));
            }
          } else {
            outgoing.remove();
            if (mode === 'heading') {
              const heading = incoming.querySelector('[data-heading]');
              animations.push(heading.animate([{opacity: .3, translate: `${direction * 8}px 0`}, {opacity: 1, translate: '0 0'}], settings));
            }
            animations.push(marker.animate([{transform: beforeMarker}, {transform: nextMarker}], settings));
          }
          await Promise.allSettled(animations.map(animation => animation.finished));
        }
      } finally {
        outgoing.remove();
        for (const animation of animations) animation.cancel();
        animations = [];
        incoming.inert = false;
        incoming.removeAttribute('aria-hidden');
        incoming.style.removeProperty('z-index');
        current = route;
        view = nextView;
        site.dataset.page = current;
        site.dataset.view = view;
        site.dataset.busy = 'false';
        status.textContent = nextView === 'article' ? currentProject : labels[current];
        globalThis.lucide?.createIcons({attrs: {width: 16, height: 16}});
      }
    }

    async function drain() {
      running = true;
      try {
        while (pending) {
          const next = pending;
          pending = null;
          await transition(next);
        }
      } finally { running = false; }
    }

    function request(next) {
      resetPull();
      pending = next;
      if (running) finishAnimations();
      else void drain();
    }

    site.addEventListener('click', event => {
      const pull = event.target.closest('.light-pull');
      if (pull) {
        if (event.detail !== 0 && performance.now() < suppressClickUntil) return;
        request({route: 'about'});
        return;
      }
      if (event.detail !== 0 && performance.now() < suppressClickUntil && event.target.closest('.light-cover')) return;
      const project = event.target.closest('[data-project]');
      if (project && site.contains(project)) { request({route: 'projects', project: project.dataset.project}); return; }
      const route = event.target.closest('[data-route]');
      if (route && site.contains(route)) { request({route: route.dataset.route}); return; }
      const thumb = event.target.closest('[data-gallery-index]');
      if (thumb && site.contains(thumb)) {
        const index = Number(thumb.dataset.galleryIndex);
        selectProject(index);
      }
    });
    function selectProject(index) {
      const title = site.querySelector('.light-project-title button');
      if (!title) return;
      const text = projectTitles[index];
      title.textContent = text + ' ↗';
      title.dataset.project = projectData[index].slug;
      const img = site.querySelector('.light-cover');
      img.src = projectImages[index];
      img.alt = projectDescriptions[index];
      site.style.setProperty('--accent', projectData[index].palette.accent);
      site.style.setProperty('--ink', projectData[index].palette.ink);
      site.querySelector('.light-project-meta span:last-child').textContent = String(index + 1).padStart(2, '0') + ' / 06';
      for (const button of site.querySelectorAll('[data-gallery-index]')) button.setAttribute('aria-current', String(Number(button.dataset.galleryIndex) === index));
      header.querySelector('[data-location-label]').textContent = text;
      status.textContent = text;
    }
    function resetPull(animateBack = false) {
      const handle = site.querySelector('.light-pull');
      const cover = site.querySelector('.light-cover');
      if (handle) {
        const position = getComputedStyle(handle).translate;
        handle.style.translate = '0 0';
        handle.dataset.armed = 'false';
        handle.querySelector('.light-pull-label').textContent = 'About';
        handle.querySelector('.light-pull-hint').textContent = 'Pull right';
        if (animateBack && !reduced.matches) {
          pullAnimation?.cancel();
          pullAnimation = handle.animate([{translate: position}, {translate: '-3px 0', offset: .8}, {translate: '0 0'}], {duration: 220, easing: 'cubic-bezier(.2,.8,.3,1)'});
        }
      }
      if (cover) cover.style.translate = '0 0';
      drag = null;
      site.dataset.pulling = 'false';
    }
    site.addEventListener('pointerdown', event => {
      if (event.button !== 0 || !event.isPrimary || site.dataset.busy === 'true') return;
      const handle = event.target.closest('.light-pull');
      if (handle) {
        pullAnimation?.cancel();
        drag = {id: event.pointerId, start: event.clientX, startY: event.clientY, distance: 0, armed: false, threshold: Math.min(128, Math.max(86, site.clientWidth * .3)), handle};
        handle.setPointerCapture(event.pointerId);
        site.dataset.pulling = 'true';
      } else if (event.target.matches('.light-cover')) {
        galleryDrag = {id: event.pointerId, start: event.clientX, startY: event.clientY, cover: event.target};
        event.target.setPointerCapture(event.pointerId);
      }
    });
    site.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.id) return;
      const distance = Math.max(0, event.clientX - drag.start);
      drag.distance = distance;
      const t = distance / drag.threshold;
      const wasArmed = drag.armed;
      if (t >= 1) drag.armed = true;
      else if (t < .75) drag.armed = false;
      const travel = t <= 1 ? 34 * (1 - (1 - t) ** 3) : 34 + 40 * (1 - Math.exp(-(t - 1) * 5));
      drag.handle.style.translate = `${travel}px 0`;
      drag.handle.dataset.armed = String(drag.armed);
      drag.handle.querySelector('.light-pull-label').textContent = drag.armed ? 'Release' : 'About';
      drag.handle.querySelector('.light-pull-hint').textContent = drag.armed ? 'Let go' : 'Pull right';
      site.dataset.pullDistance = String(Math.round(distance));
      site.dataset.pullThreshold = String(Math.round(drag.threshold));
      if (!reduced.matches) site.querySelector('.light-cover').style.translate = `${Math.min(12, travel * .16)}px 0`;
      if (wasArmed !== drag.armed) {
        status.textContent = drag.armed ? 'Release to open About' : 'About pull not yet committed';
        if (!reduced.matches) drag.handle.animate([{scale: '1'}, {scale: '.96', offset: .4}, {scale: '1.025', offset: .7}, {scale: '1'}], {duration: 130});
      }
    });
    function releasePointer(event, canceled = false) {
      if (drag && drag.id === event.pointerId) {
        const {armed, distance, handle} = drag;
        if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        if (distance >= 6) suppressClickUntil = performance.now() + 500;
        resetPull(!canceled && !armed);
        if (!canceled && armed) request({route: 'about'});
        else if (distance >= 6) status.textContent = 'Projects. About pull canceled.';
      }
      if (galleryDrag && galleryDrag.id === event.pointerId) {
        const {cover, start, startY} = galleryDrag;
        const dx = event.clientX - start;
        const dy = event.clientY - startY;
        galleryDrag = null;
        if (cover.hasPointerCapture(event.pointerId)) cover.releasePointerCapture(event.pointerId);
        if (!canceled && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          const selected = Number(site.querySelector('[data-gallery-index][aria-current="true"]').dataset.galleryIndex);
          selectProject(Math.max(0, Math.min(projectTitles.length - 1, selected + (dx < 0 ? 1 : -1))));
          suppressClickUntil = performance.now() + 500;
        }
      }
    }
    site.addEventListener('pointerup', event => releasePointer(event));
    site.addEventListener('pointercancel', event => releasePointer(event, true));
    menu.addEventListener('toggle', () => {
      const expanded = menu.open;
      site.querySelector('.light-switcher').inert = expanded;
      toggle.setAttribute('aria-label', `${expanded ? 'Close' : 'Open'} menu. ${labels[current]}`);
    });
    menu.addEventListener('focusout', event => { if (event.relatedTarget && !menu.contains(event.relatedTarget)) menu.open = false; });
    site.addEventListener('keydown', event => {
      if (event.key === 'Escape' && menu.open) { menu.open = false; toggle.focus({preventScroll: true}); }
    });
    document.addEventListener('pointerdown', event => { if (menu.open && !menu.contains(event.target)) menu.open = false; });
    reduced.addEventListener('change', () => { if (reduced.matches) { finishAnimations(); resetPull(); } });
    document.addEventListener('visibilitychange', () => { if (document.hidden) finishAnimations(); });
    window.addEventListener('resize', () => { finishAnimations(); resetPull(); });
  }
  globalThis.lucide?.createIcons({attrs: {width: 16, height: 16}});
})();
</script>
